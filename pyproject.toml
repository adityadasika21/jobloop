[project]
name = "jobloop"
version = "0.1.0"
description = "Remote-driven job application, tracking, and learning loop"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.scripts]
jt = "jt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jt"]
