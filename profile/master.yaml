# -----------------------------------------------------------------------------
# EVIDENCE UNITS
#
# claim      — the canonical true statement, as it appears on the master resume
# skills     — normalized tokens; a tailored bullet may NOT introduce a skill
#              token that is absent from the units it cites (enforced by `jt verify`)
# metrics    — hard numbers, quoted verbatim; never round or inflate these
# keywords   — JD-side vocabulary this unit legitimately answers to. These are
#              synonyms for what was ACTUALLY done, not aspirational adjacencies.
# strength   — core | strong | supporting. Drives selection under space pressure.
# probe      — what an interviewer will ask if this bullet earns a screen pass.
#              If you can't answer the probe, the bullet is too aggressive.
# emphasize  — the load-bearing terms this unit may render in bold. Aditya's own
#              resume bolds the system name, the framework, and the one number
#              worth arguing about; bolding every number bolds nothing. A term
#              is only honoured where it appears verbatim in the bullet, and
#              `jt verify` rejects any term the cited evidence doesn't support.
# -----------------------------------------------------------------------------

