# Tailored for: LLM Engineer (Remote) — Joveo AI
#
# Strategy: the JD's required list is, in order, production LLM systems / RAG +
# vector search / agentic frameworks / eval + observability / structured output
# + function calling / serving + cost. The bullets are reordered to answer that
# list top-down, and rephrased in the JD's own vocabulary. Nothing is added.
#
# The hiring-integrity bullet is kept last deliberately: it is the only
# evidence answering the "HR tech or recruitment domain" nice-to-have, which
# matters at a recruitment-marketing company.
#
# Every bullet carries provenance into profile/master.yaml. `jt verify` fails
# the build if any number or technology here is unsupported by its sources.

headline: "LLM Engineer · Agentic & Multi-Agent Systems · RAG & Vector Search · LLM Eval, Observability & Serving"
headline_provenance:
  - ev-phenom-chatbotcx-architecture
  - ev-phenom-eval-framework
  - ev-phenom-finetune-serving

experience:
  - role_id: phenom-ai-llm-eng-ii
    bullets:
      - text: >-
          Architected chatbotCXAgent, a production multi-agent system on LangGraph
          (12 orchestrated nodes) spanning intent recognition, planning,
          dialogue-state management and tool routing, with Graph RAG retrieval
          pipelines over enterprise knowledge and document repositories via FAISS
          vector search and a Neo4j graph for multi-hop, policy-aware grounding.
        provenance: [ev-phenom-chatbotcx-architecture]

      - text: >-
          Built the LLM evaluation harness and observability layer that gates releases
          across all 12 nodes — pass@k and LLM-as-judge rubrics — with LiteLLM and
          Langfuse tracing for per-node cost, latency and full-trace auditability,
          continuously monitoring agent behaviour and curbing hallucinations.
        provenance: [ev-phenom-eval-framework]

      - text: >-
          Engineered tool-calling agents that execute governed actions — database
          queries and structured extraction from unstructured documents — under
          XGrammar constrained decoding and schema-validated JSON structured output
          guardrails,
          raising tool-routing accuracy to 91.9% and eliminating malformed tool
          calls in live traffic.
        provenance: [ev-phenom-toolcalling-guardrails]

      - text: >-
          Fine-tuned and deployed open-source Qwen models via LoRA/QLoRA (Unsloth,
          NF4), serving them on vLLM / AWS g5.xlarge (A10G), sustaining 10.98 RPS at 98.6% success under load at
          roughly half the inference cost of hosted GPT-4.1.
        provenance: [ev-phenom-finetune-serving]

      - text: >-
          Fine-tuned a multi-task ModernBERT (intent + NER) in PyTorch, raising NLU
          accuracy from 87% to 97%.
        provenance: [ev-phenom-modernbert-nlu]

      - text: >-
          Designed the configuration and policy plane for an enterprise
          hiring-integrity / fraud-risk platform: a global signal registry with
          feature groups, tenant-scoped overrides and applicable-context gating,
          exposed through a resolve API consumed by the reviewer console and the
          live detection pipeline, with versioned definitions and CEL-evaluated
          decision policies.
        provenance: [ev-phenom-fraud-policy-plane]

  - role_id: blueleaves-fullstack
    bullets:
      - text: >-
          Owned end-to-end delivery of production systems (POS, CRM, inventory,
          procurement, e-commerce) on Node.js, Firebase Cloud Functions and REST
          APIs — with role-based access control and CI/CD — integrating multiple
          internal systems and cutting manual operational errors by roughly 90%.
        provenance: [ev-blueleaves-fullstack-delivery]

      - text: >-
          Built data-driven analytics on large-scale transactional and
          stock-movement data — demand forecasting, sales-trend and inventory
          models across 5+ locations and 10,000+ monthly transactions.
        provenance: [ev-blueleaves-analytics]

projects:
  - name: IndexNotes — AI Knowledge Graph for Scientific Papers
    stack: [Neo4j, Ollama, PyMuPDF, Python, Docker]
    bullets:
      - text: >-
          Built an automated Graph RAG pipeline ingesting research papers (PDF to
          local-LLM extraction to structured JSON to Neo4j), creating 40+ concepts
          and 17+ typed relationships, with quantized local models via Ollama for
          entity and relationship extraction.
        provenance: [ev-proj-indexnotes]
      - text: >-
          Designed a Neo4j schema enabling multi-hop graph traversal and
          cross-document retrieval across scientific domains.
        provenance: [ev-proj-indexnotes-schema]

  - name: NorthStar — Motorcycle Navigation Companion App
    stack: [Android, BLE, Maps SDK]
    bullets:
      - text: >-
          Built and shipped a companion app for the Royal Enfield Tripper Dash,
          delivering turn-by-turn navigation to the bike's connected instrument
          cluster and growing an organic user base without paid distribution;
          the traction led to an on-site collaboration visit at Royal Enfield HQ.
        provenance: [ev-proj-northstar, ev-proj-northstar-traction]

# Reordered so the groups the JD screens for are read first.
skill_groups:
  - name: GenAI & Agentic
    items: ["Agentic / Multi-Agent Systems", LangGraph, LangChain,
            "Tool/Function Calling", "Prompt Engineering", "Model Routing",
            "Context-Window Management", "RAG & Graph RAG",
            "LLM Fine-Tuning (QLoRA, SFT)"]
  - name: "Eval, Observability & Guardrails"
    items: ["LLM Evaluation (LLM-as-judge, pass@k)",
            "Constrained Decoding (XGrammar)", "Schema Validation", Langfuse,
            LiteLLM, "Model Monitoring", "Hallucination Mitigation"]
  - name: ML & Serving
    items: [PyTorch, "Transformers (BERT/ModernBERT)", "HuggingFace PEFT", Unsloth,
            vLLM, "Embeddings / Vector Search (FAISS)", Neo4j, Ollama,
            "Production MLOps"]
  - name: Languages
    items: [Python, JavaScript, TypeScript, SQL, Bash]
  - name: Backend & Infra
    items: [FastAPI, Node.js, "REST APIs", Microservices, Docker,
            "AWS (EC2/S3/SageMaker)", "GitHub Actions", CI/CD, Linux]
  - name: Databases
    items: [PostgreSQL, Neo4j, MongoDB, Redis, Firebase]
