headline: "LLM Inference & Serving Platform · LLM Evaluation, Monitoring & Guardrails · Multi-Tenant Agent Orchestration"
headline_provenance:
  - ev-phenom-inference-platform
  - ev-phenom-eval-framework
  - ev-phenom-toolcalling-guardrails
  - ev-phenom-chatbotcx-architecture
  - ev-phenom-frm-service

experience:
  - role_id: phenom-ai-llm-eng-ii
    bullets:
      - text: >-
          Ran the self-hosted LLM inference service as a deployable platform —
          Helm-packaged releases, custom chat templates per model,
          reasoning-model flags, and OpenTelemetry instrumentation feeding a
          metrics dashboard so per-model latency and throughput were visible in
          production.
        provenance: [ev-phenom-inference-platform]
      - text: >-
          Built an LLM evaluation framework (pass@k, LLM-as-judge rubric)
          gating every release across all 12 nodes, instrumented with LiteLLM +
          Langfuse for per-node cost, latency and full-trace auditability —
          continuously monitoring agent behaviour and curbing hallucinations.
        provenance: [ev-phenom-eval-framework]
      - text: >-
          Fine-tuned and served Qwen models via QLoRA (Unsloth, NF4) on vLLM /
          AWS g5.xlarge (A10G), sustaining 10.98 RPS at 98.6% success under load
          at roughly half the inference cost of hosted GPT-4.1.
        provenance: [ev-phenom-finetune-serving]
      - text: >-
          Hardened the fine-tuned Qwen deployment for production serving — a
          custom Jinja2 chat template, required tool-choice and temperature
          pinned at 0.1 for deterministic tool calls — then held it to a golden
          baseline of 1.0s median and 1.4s P95 latency with zero failures across
          5,510 requests, taking the service's test coverage from 7% to 78%.
        provenance: [ev-phenom-qwen-production-hardening]
      - text: >-
          Architected chatbotCXAgent, a production multi-agent system on
          LangGraph (12 orchestrated nodes) spanning intent recognition,
          planning, dialogue-state management and tool routing — with Graph RAG
          retrieval over enterprise knowledge and document repositories via
          FAISS vector search and a Neo4j graph for multi-hop, policy-aware
          grounding.
        provenance: [ev-phenom-chatbotcx-architecture]
      - text: >-
          Engineered tool-calling agents that execute governed actions —
          database queries and structured extraction from unstructured
          documents — under XGrammar constrained decoding and schema-validated
          JSON guardrails, raising tool-routing accuracy to 91.9% and
          eliminating malformed tool calls in live traffic.
        provenance: [ev-phenom-toolcalling-guardrails]
      - text: >-
          Built the fraud-risk configuration service greenfield in FastAPI on
          MongoDB — signal registry, feature groups, audience and scope
          definitions and tenant-scoped overrides — exposed through an internal
          resolve endpoint that Temporal workflows call at workflow start to
          decide which fraud signals apply to a candidate and job.
        provenance: [ev-phenom-frm-service]
      - text: >-
          Building the detection and decisioning layer of an enterprise
          hiring-integrity / fraud-risk platform — an LLM
          orchestration engine that investigates flagged candidate activity,
          correlates evidence across signals and produces reviewer-facing
          assessments with supporting rationale — backed by a policy-driven
          rules engine, per-tenant risk configuration and audited review
          workflows across the signal lifecycle.
        provenance: [ev-phenom-fraud-detection-engine]
      - text: >-
          Owned tenant provisioning and delivery for the platform — provision
          and unprovision APIs with region-scoped tenant listing, containerised
          deployment via Docker and Helm across staging environments, and
          production support debugging by querying service logs in ClickHouse to
          resolve customer tickets.
        provenance: [ev-phenom-frm-tenancy-ops]
      - text: >-
          Built conversation analytics APIs covering both live-agent and
          WhatsApp channels, raised the service's automated testing coverage
          from 63% to over 90% while clearing static-analysis code smells, and
          migrated the service to FastAPI.
        provenance: [ev-phenom-analytics-service]

  - role_id: blueleaves-fullstack
    bullets:
      - text: >-
          Owned end-to-end delivery of production systems (POS, CRM, inventory,
          procurement, e-commerce) on Node.js, Firebase Cloud Functions and REST
          APIs — with role-based access control and CI/CD — integrating multiple
          internal systems and cutting manual operational errors by roughly 90%.
        provenance: [ev-blueleaves-fullstack-delivery]

