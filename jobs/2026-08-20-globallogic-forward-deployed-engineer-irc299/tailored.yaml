headline: "Multi-Agent Systems on LangGraph · Graph RAG & FAISS Vector Search · LLM Evaluation, OpenTelemetry & Tool-Calling Guardrails"
headline_provenance:
  - ev-phenom-chatbotcx-architecture
  - ev-phenom-eval-framework
  - ev-phenom-toolcalling-guardrails
