headline: "Applied AI Engineer · Agentic Applications on LangGraph · RAG, LLM Evaluation & Langfuse · Full-Stack Python, React & FastAPI"
headline_provenance:
  - ev-phenom-chatbotcx-architecture
  - ev-phenom-eval-framework
  - ev-phenom-frm-admin-ui
  - ev-phenom-frm-service
  - ev-blueleaves-frontend

experience:
  - role_id: phenom-ai-llm-eng-ii
    bullets:
      - text: >-
          Architected chatbotCXAgent, a production multi-agent application on
          LangGraph (12 orchestrated nodes) spanning intent recognition,
          planning, dialogue-state management and tool routing — with RAG and
          Graph RAG pipelines over enterprise knowledge and document
          repositories via FAISS vector search and a Neo4j graph for multi-hop,
          policy-aware grounding.
        provenance: [ev-phenom-chatbotcx-architecture]
      - text: >-
          Engineered tool-calling agents that execute governed actions —
          database queries and structured extraction from unstructured
          documents — under XGrammar constrained decoding and schema-validated
          JSON guardrails, raising tool-routing accuracy to 91.9% and
          eliminating malformed tool calls in live traffic.
        provenance: [ev-phenom-toolcalling-guardrails]
      - text: >-
          Built an LLM evaluation framework running automated evaluations
          (pass@k, LLM-as-judge rubric) that gate every release across all 12 nodes, instrumented with LiteLLM +
          Langfuse for per-node cost, latency and full-trace auditability —
          continuously monitoring agent behaviour and curbing hallucinations.
        provenance: [ev-phenom-eval-framework]
      - text: >-
          Owned the inference cost of what I shipped: fine-tuned and served
          Qwen models via QLoRA (Unsloth, NF4) on vLLM / AWS g5.xlarge (A10G),
          sustaining 10.98 RPS at 98.6% success under load at roughly half the
          inference cost of hosted GPT-4.1.
        provenance: [ev-phenom-finetune-serving]
      - text: >-
          Building the detection and decisioning layer of an enterprise
          hiring-integrity platform — an LLM orchestration engine that
          investigates flagged activity, correlates evidence across signals and
          produces reviewer-facing decision support with supporting rationale —
          backed by a policy-driven rules engine and audited review workflows.
        provenance: [ev-phenom-fraud-detection-engine]
      - text: >-
          Built that platform end to end as a full-stack product: a greenfield
          FastAPI micro-service on MongoDB with tenant-scoped configuration,
          exposed through an internal resolve API that Temporal workflows call
          at workflow start, and a React administration front end — feature
          store, audience rules, reviewer case and action centre — built to an
          existing design system and authenticated with Keycloak.
        provenance: [ev-phenom-frm-service, ev-phenom-frm-admin-ui]
      - text: >-
          Raised engineering quality across services: conversation analytics
          APIs migrated to FastAPI with automated testing coverage raised from
          63% to over 90% and SonarQube static analysis code smells cleared, and the self-hosted inference
          service packaged as Helm releases with OpenTelemetry code instrumentation
          feeding a production metrics dashboard, plus production support
          debugging from ClickHouse service logs.
        provenance: [ev-phenom-analytics-service, ev-phenom-inference-platform,
                     ev-phenom-frm-tenancy-ops]
      - text: >-
          Work with MCP (Model Context Protocol) servers — ClickHouse,
          Playwright and Atlassian — through Claude Code as the tool layer in
          day-to-day agent development, debugging and issue tracking.
        provenance: [ev-phenom-mcp-tooling]

  - role_id: blueleaves-fullstack
    bullets:
      - text: >-
          Sole engineer on the whole stack — built the CRM and internal tools
          as React and Vite web applications, owning the user interface as well
          as the services behind it.
        provenance: [ev-blueleaves-frontend]
      - text: >-
          Owned end-to-end delivery of production systems (POS, CRM, inventory,
          procurement, e-commerce) on Node.js, serverless Firebase Cloud
          Functions and REST APIs — with role-based access control and CI/CD —
          integrating multiple internal systems and cutting manual operational
          errors by roughly 90%.
        provenance: [ev-blueleaves-fullstack-delivery]
      - text: >-
          Ran customer discovery directly with business stakeholders — shareholders, company VPs and external
          partner businesses — to scope projects and implementations,
          translating their operational asks into technical designs and
          delivering them end to end.
        provenance: [ev-blueleaves-stakeholder-discovery]

