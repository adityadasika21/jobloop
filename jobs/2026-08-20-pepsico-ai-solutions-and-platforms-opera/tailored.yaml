experience:
  - role_id: phenom-ai-llm-eng-ii
    bullets:
      - text: >-
          Built an LLM evaluation framework (pass@k, LLM-as-judge rubric) gating
          every release across all 12 nodes, instrumented with LiteLLM +
          Langfuse for per-node cost, latency and full-trace auditability —
          continuously monitoring agent behaviour and curbing hallucinations.
        provenance: [ev-phenom-eval-framework]
      - text: >-
          Ran the self-hosted LLM inference service as a deployable platform —
          Helm-packaged deployments, custom chat templates per model, and
          OpenTelemetry instrumentation feeding metrics dashboards so
          per-model latency and throughput were visible in production.
        provenance: [ev-phenom-inference-platform]
      - text: >-
          Built the configuration service in FastAPI on MongoDB — a global
          signal registry with definition versioning that keeps downstream
          consumers stable across config changes, feature groups, audience and
          scope rules, and tenant-scoped overrides — exposed through an
          internal resolve endpoint that Temporal workflows call at workflow
          start to decide which checks run for a given candidate and job.
        provenance: [ev-phenom-frm-service, ev-phenom-fraud-policy-plane]
      - text: >-
          Architected chatbotCXAgent, a production multi-agent system on
          LangGraph (12 orchestrated nodes) spanning intent recognition,
          planning, dialogue-state management and tool routing — with Graph RAG
          retrieval over enterprise knowledge and document repositories via
          FAISS vector search and a Neo4j graph for multi-hop, policy-aware
          grounding.
        provenance: [ev-phenom-chatbotcx-architecture]
      - text: >-
          Engineered tool-calling agents that execute governed actions under
          XGrammar constrained decoding and schema-validated JSON guardrails,
          raising tool-routing accuracy to 91.9% and eliminating malformed tool-call
          failures in live traffic.
        provenance: [ev-phenom-toolcalling-guardrails]
      - text: >-
          Held the production model deployment to a golden baseline of 1.0s
          median and 1.4s P95 latency with zero failures across 5,510 requests,
          taking the service's automated testing coverage from 7% to 78%.
        provenance: [ev-phenom-qwen-production-hardening]
      - text: >-
          Built the detection and decisioning layer of an enterprise
          hiring-integrity platform — an LLM orchestration engine that
          performs evidence correlation across signals and produces reviewer-facing
          assessments with supporting rationale — backed by a policy-driven
          rules engine, per-tenant risk configuration, and audited review
          workflows across the signal lifecycle.
        provenance: [ev-phenom-fraud-detection-engine]
      - text: >-
          Owned deployment automation and production support — containerized deployments via
          Docker and Helm across staging environments, and debug of production incidents
          by querying service logs in ClickHouse to resolve customer tickets.
        provenance: [ev-phenom-frm-tenancy-ops]

  - role_id: blueleaves-fullstack
    bullets:
      - text: >-
          Owned end-to-end delivery of production systems (POS, CRM, inventory,
          procurement, e-commerce) on Node.js, Firebase Cloud Functions and REST
          APIs — with role-based access control and CI/CD — integrating multiple
          internal systems and cutting manual operational errors by roughly 90%.
        provenance: [ev-blueleaves-fullstack-delivery]

projects:
  - name: IndexNotes — AI Knowledge Graph for Scientific Papers
    stack: [Neo4j, Ollama, PyMuPDF, Python, Docker]
    bullets:
      - text: >-
          Built an automated Graph RAG pipeline ingesting research papers (PDF →
          local-LLM extraction → structured JSON → Neo4j), creating 40+ concepts
          and 17+ typed relationships, with quantized local models via Ollama
          for entity/relationship extraction.
        provenance: [ev-proj-indexnotes]

