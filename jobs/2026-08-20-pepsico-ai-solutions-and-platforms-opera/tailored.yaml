# Tailored for: AI Solutions and Platforms Operations Engineer — PepsiCo
# (posting title: AI Observability Engineer — Agentic Frameworks & AI Agent
# Operations Center Developer, Hyderabad)
#
# Strategy: this is an observability/operations role, not a modelling one —
# 70% of it is an "AI Agent Operations Center": registry, versioning, run
# tracking, health dashboards (success rate, latency, tool failure rate, cost
# per run), and telemetry across prompts, tool calls and retrieval. So the eval
# + Langfuse/LiteLLM instrumentation bullet leads, not the architecture one.
# Then the agent orchestration the ops center exists to watch, then the
# guardrail work that is literally "tool failure rate", then the policy plane —
# a signal registry with versioned definitions, tenant-scoped overrides and a
# resolve API behind a reviewer console, which is the closest true analogue to
# the internal operational console the JD asks for.
#
# Gaps left as gaps (they go in the screening report, never into a bullet):
#   - OpenTelemetry, semantic conventions, telemetry pipelines. The tracing and
#     per-node cost/latency work is real, but it is LiteLLM + Langfuse. OTel is
#     not on the resume and must not be implied.
#   - Kubernetes / AKS / EKS. Docker in production; orchestration not owned.
#   - Azure, and Azure AI Search. Cloud evidence is AWS (EC2/S3/SageMaker/g5).
#   - Crew.ai, Semantic Kernel, AutoGen. The JD says "or similar" and LangGraph
#     and LangChain are shipped, so the requirement is met — but the three
#     named frameworks are not claimed.
#   - Education: B.Tech Mechanical against a JD asking for a CS/AI/DS degree.
#   - "agent registry" specifically: the registry he built is a fraud-signal
#     registry. Same shape, different objects, and it stays worded as what it is.
#
# Every bullet carries provenance into profile/master.yaml. `jt verify` fails
# the build if any number or technology here is unsupported by its sources.

headline: "AI/LLM Engineer · LLM Evaluation, Observability & Guardrails · Multi-Agent Orchestration on LangGraph"
headline_provenance:
  - ev-phenom-eval-framework
  - ev-phenom-toolcalling-guardrails
  - ev-phenom-chatbotcx-architecture

experience:
  - role_id: phenom-ai-llm-eng-ii
    bullets:
      - text: >-
          Built an LLM evaluation framework (pass@k, LLM-as-judge rubric) gating
          every release across all 12 nodes, instrumented with LiteLLM and
          Langfuse for per-node cost, latency and full-trace auditability —
          continuously monitoring production agent behaviour and curbing
          hallucinations.
        provenance: [ev-phenom-eval-framework]

      - text: >-
          Architected chatbotCXAgent, a production multi-agent system on
          LangGraph whose orchestration spans 12 nodes covering intent
          recognition, planning, dialogue-state management and tool routing,
          with Graph RAG retrieval over enterprise knowledge and document
          repositories via FAISS vector search and a Neo4j graph for multi-hop,
          policy-aware grounding.
        provenance: [ev-phenom-chatbotcx-architecture]

      - text: >-
          Engineered tool-calling agents that execute governed actions —
          database queries and structured extraction from unstructured
          documents — under XGrammar constrained decoding and schema-validated
          JSON guardrails, raising tool-routing accuracy to 91.9% and
          eliminating malformed tool calls in live traffic.
        provenance: [ev-phenom-toolcalling-guardrails]

      - text: >-
          Designed the configuration and policy plane for an enterprise
          hiring-integrity / fraud-risk platform: a global fraud-signal registry
          with feature groups, tenant-scoped overrides and applicable-context
          gating, exposed through a resolve API consumed by the reviewer console
          and the live detection pipeline, with a role-gated signal-lifecycle
          state machine, definition versioning that keeps downstream consumers
          stable across configuration changes, and CEL-evaluated decision
          policies (score / condition to action).
        provenance: [ev-phenom-fraud-policy-plane]

      - text: >-
          Building the detection and decisioning layer of that platform — an LLM
          orchestration engine that investigates flagged candidate activity,
          correlates evidence across signals and produces reviewer-facing
          assessments with supporting rationale — backed by a policy-driven
          rules engine, per-tenant risk configuration and audited review
          workflows across the signal lifecycle.
        provenance: [ev-phenom-fraud-detection-engine]

      - text: >-
          Fine-tuned and served Qwen models via QLoRA (Unsloth, NF4) on vLLM /
          AWS g5.xlarge (A10G), sustaining 10.98 RPS at 98.6% success under load
          at roughly half the inference cost of hosted GPT-4.1.
        provenance: [ev-phenom-finetune-serving]

  - role_id: blueleaves-fullstack
    bullets:
      - text: >-
          Owned end-to-end delivery of production systems (POS, CRM, inventory,
          procurement, e-commerce) on Node.js, Firebase Cloud Functions and REST
          APIs — with role-based access control and CI/CD pipelines — integrating
          internal systems and cutting manual operational errors by roughly 90%.
        provenance: [ev-blueleaves-fullstack-delivery]

# Cut for space, in the order this JD cares least about them: the demand-
# forecasting analytics bullet (this role is agent health, not BI) and the
# NorthStar app (product shipping, but nothing to do with agent operations).
