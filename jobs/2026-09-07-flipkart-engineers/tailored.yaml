experience:
  - role_id: phenom-ai-llm-eng-ii
    bullets:
      - text: >-
          Designed the configuration and policy plane for an enterprise
          hiring-integrity / fraud-risk platform: a global fraud-signal registry
          with feature groups, tenant-scoped overrides and applicable-context
          gating, exposed through one resolve API consumed by both the reviewer
          console and the live detection pipeline — with a role-gated
          signal-lifecycle state machine, versioned definitions that keep every
          downstream consumer stable across config changes, and CEL-evaluated
          decision policies (score / condition → action).
        provenance: [ev-phenom-fraud-policy-plane]
        emphasize: ["resolve API"]
      - text: >-
          Built the fraud-risk configuration service greenfield in FastAPI on
          MongoDB — signal registry, feature groups, audience and scope
          definitions and tenant-scoped overrides — exposed through an internal
          resolve endpoint that Temporal workflows call at workflow start to
          decide which fraud signals apply to a candidate and job.
        provenance: [ev-phenom-frm-service]
        emphasize: [FastAPI, MongoDB, Temporal]
      - text: >-
          Merged fraud-risk resolve into the interview-intelligence Temporal
          workflows and removed the Policy Engine gating that had decided which
          checks to run, making the configuration service the single source of
          truth for fraud enablement and replacing hardcoded per-tenant flags
          with audience rules resolved per candidate.
        provenance: [ev-phenom-frm-decides-what-runs]
        emphasize: ["single source of truth"]
      - text: >-
          Architected chatbotCXAgent, a production multi-agent system on
          LangGraph (12 orchestrated nodes) spanning intent recognition,
          planning, dialogue-state management and tool routing — with Graph RAG
          retrieval over enterprise knowledge and document repositories via
          FAISS vector search and a Neo4j graph for multi-hop, policy-aware
          grounding.
        provenance: [ev-phenom-chatbotcx-architecture]
        emphasize: [LangGraph]
      - text: >-
          Engineered tool-calling agents that execute governed actions —
          database queries and structured extraction from unstructured
          documents — under XGrammar constrained decoding and schema-validated
          JSON guardrails, raising tool-routing accuracy to 91.9% and
          eliminating malformed tool calls in live traffic.
        provenance: [ev-phenom-toolcalling-guardrails]
        emphasize: ["91.9%"]
      - text: >-
          Held the production inference service to a golden baseline of 1.0s
          median and 1.4s P95 latency with zero failures across 5,510 requests
          — a custom Jinja2 chat template disabling the model's thinking mode,
          required tool-choice and temperature pinned at 0.1 for deterministic
          tool calls, and eager execution forced because CUDA graphs break on
          the model's hybrid Mamba-attention architecture — taking the
          service's test coverage from 7% to 78%.
        provenance: [ev-phenom-qwen-production-hardening]
        emphasize: ["1.4s", "5,510", "7% to 78%"]
      - text: >-
          Built conversation analytics APIs covering both live-agent and
          WhatsApp channels, raised the service's test coverage from 63% to
          over 90% while clearing static-analysis code smells, and migrated the
          service to FastAPI.
        provenance: [ev-phenom-analytics-service]
        emphasize: ["63% to over 90%", FastAPI]
      - text: >-
          Owned tenant provisioning and delivery for the platform — provision
          and unprovision APIs with region-scoped tenant listing, containerised
          deployment via Docker and Helm across staging environments,
          OpenTelemetry instrumentation feeding a metrics dashboard so per-model
          latency and throughput were visible in production, and production
          support debugging by querying service logs in ClickHouse to resolve
          customer tickets.
        provenance: [ev-phenom-frm-tenancy-ops, ev-phenom-inference-platform]
        emphasize: [Docker, Helm, ClickHouse]
      - text: >-
          Use agentic tools in day-to-day development work — MCP (Model Context
          Protocol) servers (ClickHouse, Playwright and Atlassian) through
          Claude Code as the tool layer for agent development, debugging and
          issue tracking.
        provenance: [ev-phenom-mcp-tooling]
        emphasize: ["MCP (Model Context Protocol) servers"]

  - role_id: blueleaves-fullstack
    bullets:
      - text: >-
          Owned end-to-end delivery of production systems (POS, CRM, inventory,
          procurement, e-commerce) on Node.js, Firebase Cloud Functions and REST
          APIs — with role-based access control and CI/CD — integrating multiple
          internal systems and cutting manual operational errors by roughly 90%.
        provenance: [ev-blueleaves-fullstack-delivery]
      - text: >-
          Built data-driven analytics on large-scale transactional and
          stock-movement data — demand forecasting, sales-trend and inventory
          models that surfaced discrepancies and improved
          procurement/replenishment decisions across 5+ locations and 10,000+
          monthly transactions.
        provenance: [ev-blueleaves-analytics]
      - text: >-
          Sole engineer on the whole stack, working directly with
          cross-functional stakeholders — shareholders, company VPs and external
          partner businesses — to scope projects and implementations,
          translating their operational asks into technical designs and
          delivering them end to end.
        provenance: [ev-blueleaves-frontend, ev-blueleaves-stakeholder-discovery]
        emphasize: ["Sole engineer"]

projects:
  - name: "NorthStar — Motorcycle Navigation Companion App"
    stack: [Android, Kotlin, UDP, RTP, MapLibre]
    bullets:
      - text: >-
          Built and shipped a companion app for the Royal Enfield Tripper Dash,
          delivering turn-by-turn navigation to the bike's connected instrument
          cluster and growing an organic user base without paid distribution;
          the traction drew Royal Enfield's attention directly, leading to an
          on-site visit at their HQ and a continuing relationship.
        provenance: [ev-proj-northstar, ev-proj-northstar-traction]
        emphasize: ["Royal Enfield"]
      - text: >-
          Reverse-engineered the dash's undocumented wire protocol — an RSA-1024
          plus AES-256 handshake over UDP with auto-discovery of any dash
          advertising itself on the local network, and an H.264 over RTP video
          plane on a separate port.
        provenance: [ev-proj-northstar-protocol]
        emphasize: ["RSA-1024", "AES-256", "H.264"]

