      e-commerce) on Node.js, Firebase Cloud Functions and REST APIs — with role-based access
      control and CI/CD — integrating multiple internal systems and cutting manual operational
      errors by roughly 90%.
    provenance:
    - ev-blueleaves-fullstack-delivery
  - text: Built data-driven analytics on large-scale transactional and stock-movement data
