experience:
- role_id: phenom-ai-llm-eng-ii
  bullets:
  - text: 'Designed the configuration and policy plane for an enterprise hiring-integrity
      / fraud-risk platform: a global fraud-signal registry with feature groups, tenant-scoped
      overrides and applicable-context gating, exposed through a resolve API consumed by the
      reviewer console and the live detection pipeline — including a role-gated signal-lifecycle
      state machine, definition versioning that keeps every downstream consumer stable across
      config changes, and CEL-evaluated decision policies (score / condition → action).'
    provenance:
    - ev-phenom-fraud-policy-plane
    emphasize:
    - resolve API
  - text: Building the detection and decisioning layer of an enterprise hiring-integrity /
      fraud-risk platform — an LLM orchestration engine that investigates flagged candidate
      activity, correlates evidence across signals and produces reviewer-facing assessments
      with supporting rationale — backed by a policy-driven rules engine (score / condition
      → action), per-tenant risk configuration and audited review workflows across the signal
      lifecycle.
    provenance:
    - ev-phenom-fraud-detection-engine
    emphasize:
    - policy-driven rules engine
  - text: Built the evaluation and observability layer gating every release across all 12
      nodes (pass@k, LLM-as-judge rubric), instrumented with LiteLLM + Langfuse for per-node
      cost, latency and full-trace auditability — continuously monitoring agent behaviour
      and curbing hallucinations.
    provenance:
    - ev-phenom-eval-framework
    emphasize:
    - LiteLLM + Langfuse
  - text: Engineered tool-calling agents that execute governed actions — database queries
      and structured extraction from unstructured documents — under XGrammar constrained decoding
      and schema-validated JSON guardrails, raising tool-routing accuracy to 91.9% and eliminating
      malformed tool calls in live traffic.
    provenance:
    - ev-phenom-toolcalling-guardrails
    emphasize:
    - 91.9%
- role_id: blueleaves-fullstack
  bullets:
