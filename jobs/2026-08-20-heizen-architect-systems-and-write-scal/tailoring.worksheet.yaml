_instructions: 'Write tailored.yaml from this worksheet. RULES: (1) every bullet needs `provenance:
  [evidence-id]`; (2) never state a number that is not in the cited unit''s claim/metrics;
  (3) never name a technology the cited units don''t mention; (4) rephrase in the JD''s vocabulary
  but do not upgrade scope, seniority, or ownership; (5) unmatched requirements stay gaps
  — report them, don''t invent; (6) `emphasize:` on a bullet bolds load-bearing terms, but
  only terms the cited units contain — default to the unit''s own list. Run `jt verify 2026-08-20-heizen-architect-systems-and-write-scal`
  until clean.'
