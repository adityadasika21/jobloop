        provenance: [ev-proj-indexnotes]
      - text: >-
          Designed a Neo4j schema enabling multi-hop graph traversal and
          cross-document information retrieval across scientific domains.
        provenance: [ev-proj-indexnotes-schema]

  - name: NorthStar — Motorcycle Navigation Companion App
    stack: [Android, BLE, Maps SDK]
