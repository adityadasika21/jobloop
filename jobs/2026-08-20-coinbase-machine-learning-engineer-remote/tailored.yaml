# Tailored for: Machine Learning Engineer (IC4, Remote - India) — Coinbase
#
# NOTE: the generated worksheet's requirement list is junk for this JD — the
# extractor picked up the trailing benefits/disclosures bullets ("Fertility
# Benefits", "E-Verify Notice") instead of the "What you'll do" / "Required
# Skills and Experience" bullets, which in this page are rendered as a bare
# "-" line followed by the text on the next line. This file is written from
# jd.md directly.
#
# Strategy: the team is CX Intelligence — the multi-agent platform behind
# Coinbase chat, Help Center and agent tooling — and the role is explicitly an
# orchestration layer that manages state transitions, context sharing and
# intent routing across LLM frameworks. chatbotCXAgent is the same shape of
# system, so it leads. Then, in the JD's own order: production ML services,
# reliability of routing/handoff, measurable eval + cost, deep learning, an
# NLP/IR domain, and finally system design under security and compliance.
#
# Gaps left as gaps (they go in the screening report, not into a bullet):
# LangSmith (the eval work is LiteLLM + Langfuse), Google ADK, Vertex AI, and
# AWS Bedrock. Serving evidence is vLLM on AWS g5/EC2, which is adjacent to
# Bedrock but is not Bedrock.
#
# Every bullet carries provenance into profile/master.yaml. `jt verify` fails
# the build if any number or technology here is unsupported by its sources.

headline: "Machine Learning Engineer · Multi-Agent Orchestration on LangGraph · Graph RAG & Vector Search · LLM Evaluation, Observability & Serving"
headline_provenance:
  - ev-phenom-chatbotcx-architecture
  - ev-phenom-eval-framework
  - ev-phenom-finetune-serving

experience:
  - role_id: phenom-ai-llm-eng-ii
    bullets:
      - text: >-
          Architected chatbotCXAgent, a production multi-agent conversational
          system on LangGraph whose orchestration layer coordinates 12 nodes
          spanning intent recognition, planning, dialogue-state management and
          tool routing, with Graph RAG information retrieval over enterprise
          knowledge and document repositories via FAISS vector search and a Neo4j
          graph for multi-hop, policy-aware grounding.
        provenance: [ev-phenom-chatbotcx-architecture]

      - text: >-
          Engineered tool-calling agents that execute governed actions — database
          queries and structured extraction from unstructured documents — under
          XGrammar constrained decoding and schema-validated JSON guardrails,
          raising tool-routing accuracy to 91.9% and eliminating malformed tool
          calls in live traffic.
        provenance: [ev-phenom-toolcalling-guardrails]

      - text: >-
          Built an LLM evaluation framework (pass@k, LLM-as-judge rubric) gating
          every release across all 12 nodes, instrumented with LiteLLM and Langfuse
          for per-node cost, latency and full-trace auditability — continuously
          monitoring agent behaviour and curbing hallucinations.
        provenance: [ev-phenom-eval-framework]

      - text: >-
          Fine-tuned and served Qwen models via QLoRA (Unsloth, NF4) on vLLM /
          AWS g5.xlarge (A10G), sustaining 10.98 RPS at 98.6% success under load
          at roughly half the inference cost of hosted GPT-4.1.
        provenance: [ev-phenom-finetune-serving]

      - text: >-
          Fine-tuned a multi-task ModernBERT (intent + NER) in PyTorch, raising NLU
          accuracy from 87% to 97%.
        provenance: [ev-phenom-modernbert-nlu]

      - text: >-
          Designed the configuration and policy plane for an enterprise
          hiring-integrity / fraud-risk platform: a global fraud-signal registry
          with feature groups, tenant-scoped overrides and applicable-context
          gating, exposed through a resolve API consumed by the reviewer console
          and the live detection pipeline, with a role-gated signal-lifecycle
          state machine, versioned definitions that keep downstream consumers
          stable across config changes, and CEL-evaluated decision policies.
        provenance: [ev-phenom-fraud-policy-plane]

  - role_id: blueleaves-fullstack
    bullets:
      - text: >-
          Owned end-to-end delivery of production systems (POS, CRM, inventory,
          procurement, e-commerce) on Node.js, Firebase Cloud Functions and REST
          APIs — with role-based access control and CI/CD — integrating multiple
          internal systems and cutting manual operational errors by roughly 90%.
        provenance: [ev-blueleaves-fullstack-delivery]

      - text: >-
          Built data-driven analytics on large-scale transactional and
          stock-movement data — demand forecasting, sales-trend and inventory
          modeling across 5+ locations and 10,000+ monthly transactions.
        provenance: [ev-blueleaves-analytics]

projects:
