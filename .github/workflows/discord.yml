name: discord commands

# Receives slash commands from the Discord bot (Cloud Run) via
# repository_dispatch. The bot answers Discord inside its 3-second budget and
# fires an event here; this workflow does the real work and reports back
# through the bot's /postmessage endpoint.
#
# SETUP
#   secret DISCORD_POST_URL  → https://senddiscordbot-f6q5ge4umq-uc.a.run.app/postmessage
#
# There is deliberately NO ANTHROPIC_API_KEY here. Judgment runs on Aditya's
# workstation against his Claude Code subscription, on a systemd timer — see
# scripts/run-routine.sh. This workflow does the deterministic half of a
# command and drops the rest in inbox/ for the routine to drain.

on:
  repository_dispatch:
    types: [jobloop-intake, jobloop-status, jobloop-advance, jobloop-message,
            jobloop-context, jobloop-freetext]

permissions:
  contents: write

concurrency:
  # Serialize against the other writers — three workflows pushing to main
  # would race. Do not cancel: a cancelled run can leave a job half-tailored.
  group: jobloop-write
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    env:
      DISCORD_POST_URL: ${{ secrets.DISCORD_POST_URL }}
      DISCORD_CHANNEL_ID: ${{ github.event.client_payload.channel_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pushing needs full history, and other writers may be ahead.
          fetch-depth: 0

      - name: Set up jt
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config user.name  "jobloop-bot"
          git config user.email "actions@github.com"

      # ---------------------------------------------------------------- intake
      - name: Capture the JD
        if: github.event.action == 'jobloop-intake'
        id: intake
        env:
          JD_TEXT: ${{ github.event.client_payload.text }}
          JD_COMPANY: ${{ github.event.client_payload.company }}
          JD_ROLE: ${{ github.event.client_payload.role }}
          JD_FILE: ${{ github.event.client_payload.attachment_url }}
        shell: bash
        run: |
          set -o pipefail
          # Every text input Discord offers has a cap — 6000 characters on a
          # slash-command option, 4000 on a modal field — and job descriptions
          # are routinely longer. An attachment has no such limit, and Discord
          # turns any paste over 2000 characters into a message.txt by itself.
          # Fetching happens here rather than in the bot, which has three
          # seconds to answer Discord. The CDN link is signed and short-lived,
          # which is fine: this runs seconds later.
          if [ -n "$JD_FILE" ]; then
            if curl -fsSL --max-time 30 "$JD_FILE" -o "$RUNNER_TEMP/jd.txt"; then
              echo "fetched $(wc -c < "$RUNNER_TEMP/jd.txt") bytes from the attachment"
              JD_TEXT="$(cat "$RUNNER_TEMP/jd.txt")"
            else
              echo "could not fetch the attachment; falling back to any text given" >&2
            fi
          fi
          # Build the argument list as an array — a company like "The Standard
          # India" word-splits into three arguments if interpolated unquoted.
          args=(--source discord --no-push)
          [ -n "$JD_COMPANY" ] && args+=(--company "$JD_COMPANY")
          [ -n "$JD_ROLE" ]    && args+=(--role "$JD_ROLE")
          # --no-push: this job pushes once at the end, after tailoring, so a
          # failed tailor doesn't leave a half-written commit on main.
          printf '%s' "$JD_TEXT" | jt intake "${args[@]}" | tee "$RUNNER_TEMP/intake.log"
          slug=$(head -1 "$RUNNER_TEMP/intake.log" | awk '{print $2}')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          # Only tailorable if the JD actually came through with real text.
          if python3 scripts/tailorable.py 1 | grep -q "$slug"; then
            echo "tailorable=true" >> "$GITHUB_OUTPUT"
          else
            echo "tailorable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report capture
        if: github.event.action == 'jobloop-intake'
        run: |
          {
            cat "$RUNNER_TEMP/intake.log"
            if [ "${{ steps.intake.outputs.tailorable }}" != "true" ]; then
              echo ""
              echo "No usable JD text — the link is probably behind a login."
              echo "Paste the description text and I'll tailor against it."
            fi
            # Plenty of JDs never name the employer — "our products", "our
            # centers". No regex can recover what is not written down, so ask
            # rather than leaving an unknown-company stub in the pipeline.
            if grep -q "could not determine company" "$RUNNER_TEMP/intake.log"; then
              echo ""
              echo "That description never names the company. Tell me with:"
              echo "  /j ${{ steps.intake.outputs.slug }} is at <company>"
            fi
          } | python3 scripts/discord_post.py --code

      - name: Say who tailors it
        if: github.event.action == 'jobloop-intake' && steps.intake.outputs.tailorable == 'true'
        run: |
          # Tailoring is judgment, so it happens on the workstation. The
          # routine picks this up from `scripts/tailorable.py`, which lists
          # exactly the jobs that have real JD text and no tailored.yaml yet —
          # no queue entry needed, the repo state IS the queue.
          echo "Captured. The routine tailors it on the workstation and posts the resume and screening report here." \
            | python3 scripts/discord_post.py

      # ---------------------------------------------------------------- status
      - name: Pipeline status
        if: github.event.action == 'jobloop-status'
        env:
          SLUG: ${{ github.event.client_payload.slug }}
        run: |
          if [ -n "$SLUG" ]; then
            jt show "$SLUG" | python3 scripts/discord_post.py --code
          else
            jt status | python3 scripts/discord_post.py --code
          fi

      # --------------------------------------------------------------- advance
      - name: Advance a job
        if: github.event.action == 'jobloop-advance'
        env:
          SLUG: ${{ github.event.client_payload.slug }}
          NEW_STATUS: ${{ github.event.client_payload.status }}
        run: |
          jt advance "$SLUG" "$NEW_STATUS" --no-push 2>&1 \
            | python3 scripts/discord_post.py --code

      # --------------------------------------------------------------- message
      # /msg <job> <type> [name], and /ln_msg <jd> [name] [type].
      # The scaffold is deterministic and happens here; the one varying
      # paragraph is judgment, so it is queued for the routine, which writes
      # it, runs `jt verify --message`, and posts it.
      - name: Scaffold the message
        if: github.event.action == 'jobloop-message'
        id: msg
        env:
          SLUG: ${{ github.event.client_payload.slug }}
          MTYPE: ${{ github.event.client_payload.type }}
          NAME: ${{ github.event.client_payload.name }}
          JD_TEXT: ${{ github.event.client_payload.text }}
        shell: bash
        run: |
          set -o pipefail
          slug="$SLUG"
          # /ln_msg hands over a JD rather than a slug. Intake first — it is
          # idempotent (find_duplicate returns the existing job), so posting
          # the same JD to /cv and then to /ln_msg tracks one job, not two.
          if [ -z "$slug" ] && [ -n "$JD_TEXT" ]; then
            printf '%s' "$JD_TEXT" | jt intake --source discord --no-push \
              | tee "$RUNNER_TEMP/intake.log"
            slug=$(head -1 "$RUNNER_TEMP/intake.log" | awk '{print $2}')
          fi
          if [ -z "$slug" ]; then
            echo "no job and no JD text — nothing to write about" \
              | python3 scripts/discord_post.py
            exit 1
          fi
          jt message "$slug" --type "$MTYPE" --name "$NAME" --scaffold \
            | tee "$RUNNER_TEMP/msg.log"
          # "scaffold jobs/<slug>/messages/<type>.yaml" -> both fields.
          path=$(head -1 "$RUNNER_TEMP/msg.log" | awk '{print $2}')
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$path" | cut -d/ -f2)" >> "$GITHUB_OUTPUT"

      - name: Queue the pitch for the routine
        if: github.event.action == 'jobloop-message'
        env:
          SLUG: ${{ steps.msg.outputs.slug }}
          MTYPE: ${{ github.event.client_payload.type }}
          CHANNEL: ${{ github.event.client_payload.channel_id }}
        run: |
          # The scaffold is deterministic and already written. Only the one
          # varying paragraph needs judgment, and judgment lives on the
          # workstation.
          jt inbox add message --slug "$SLUG" --type "$MTYPE" --channel "$CHANNEL"
          echo "Scaffolded a $MTYPE for $SLUG. The routine writes the pitch, checks every claim in it against your evidence, and posts it here." \
            | python3 scripts/discord_post.py

      # --------------------------------------------------------------- context
      # /ctx <text>. Ends up written straight into profile/master.yaml —
      # Aditya's explicit call on 2026-08-19, with the risk on the table. What
      # stands in for a confirmation gate is `jt evidence add`'s validation: a
      # required probe phrased as a question, a real role id, a unique id, and
      # a rollback if the splice produces anything the loader or
      # verify_profile rejects. The unit records the words that produced it,
      # so any claim can be traced back to what he actually said.
      - name: Draft the evidence unit
        if: github.event.action == 'jobloop-context'
        id: ctx
        env:
          CTX_TEXT: ${{ github.event.client_payload.text }}
        shell: bash
        run: |
          set -o pipefail
          printf '%s' "$CTX_TEXT" | jt evidence draft - \
            | tee "$RUNNER_TEMP/ctx.log"

      - name: Queue the unit for the routine
        if: github.event.action == 'jobloop-context'
        env:
          CTX_TEXT: ${{ github.event.client_payload.text }}
          CHANNEL: ${{ github.event.client_payload.channel_id }}
        run: |
          printf '%s' "$CTX_TEXT" | jt inbox add context - --channel "$CHANNEL"
          echo "Got it. The routine turns that into an evidence unit and posts back the claim it wrote plus the probe it commits you to answering." \
            | python3 scripts/discord_post.py

      # ------------------------------------------------------------- freetext
      # /j <anything>. The other commands make you name a job and pick a status
      # from a menu; nobody types like that on a phone. This one takes the
      # sentence as it was actually said — "auric ai round 1 done, waiting for
      # feedback, question was on RAG and entity resolution" — and works out
      # which job, what happened, and which jt commands say so.
      #
      # Note what it does NOT do: decide anything jt already decides. Job
      # resolution is `jt find`, status ordering is `jt advance`, provenance is
      # `jt verify`. The model reads the sentence and picks the commands; the
      # commands still enforce every rule.
      - name: Queue it for the routine
        if: github.event.action == 'jobloop-freetext'
        env:
          TEXT: ${{ github.event.client_payload.text }}
          CHANNEL: ${{ github.event.client_payload.channel_id }}
        run: |
          # Nothing here is deterministic — working out what he meant IS the
          # work, so all of it goes to the routine.
          printf '%s' "$TEXT" | jt inbox add freetext - --channel "$CHANNEL"

      # ----------------------------------------------------------------- push
      - name: Commit and push
        if: always()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to stage"
          else
            git commit -m "discord: ${{ github.event.action }}"
          fi
          # `jt` auto-commits, so "nothing to stage" does NOT mean "nothing to
          # push". This exited 0 here and threw the commit away with the
          # runner: two JDs were captured, committed, reported in Discord, and
          # silently lost. Decide on what is ahead of origin, not on the index.
          if [ -z "$(git log --oneline origin/main..HEAD)" ]; then
            echo "nothing to push"
            exit 0
          fi
          echo "pushing: $(git log --oneline origin/main..HEAD | wc -l) commit(s)"
          # Another writer may have landed while we worked.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race, retrying ($i)"
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1
