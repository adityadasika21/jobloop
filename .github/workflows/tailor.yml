name: tailor queued jobs

# Unattended tailoring without depending on a claude.ai cloud environment.
#
# There are two ways to run the loop while Aditya is away:
#   1. a scheduled routine at claude.ai/code  (needs an environment he creates)
#   2. this workflow                          (needs only ANTHROPIC_API_KEY)
# They do the same work and are safe to have both — jt verify is idempotent and
# a job already tailored is skipped. Disable whichever he doesn't want.
#
# SETUP: add repository secret ANTHROPIC_API_KEY. Without it this workflow
# no-ops rather than failing, so a fork or a fresh clone stays green.

on:
  schedule:
    - cron: "23 */3 * * *"   # off the hour on purpose; the :00 slot is crowded
  workflow_dispatch:
    inputs:
      slug:
        description: "Tailor only this job slug"
        required: false

permissions:
  contents: write

concurrency:
  group: jobloop-tailor
  cancel-in-progress: false

jobs:
  tailor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for API key
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping. Add it in repo settings."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up jt
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv && uv pip install -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Anything to do?
        if: steps.gate.outputs.run == 'true'
        id: queue
        run: |
          # scripts/tailorable.py skips jobs created from application
          # emails — they have no JD to tailor against.
          queued=$(python3 scripts/tailorable.py 3)
          echo "slugs=$queued" >> "$GITHUB_OUTPUT"
          [ -n "$queued" ] && echo "will tailor: $queued" || echo "nothing queued"

      - name: Tailor
        if: steps.gate.outputs.run == 'true' && steps.queue.outputs.slugs != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read CLAUDE.md and follow it exactly. Tailor these jobs:
            ${{ steps.queue.outputs.slugs }}

            For each slug:
              1. jt worksheet <slug>
              2. Write jobs/<slug>/tailored.yaml from the worksheet.
                 THE RULE: every bullet needs provenance into
                 profile/master.yaml. Never state a number or name a
                 technology the cited units don't support. Never upgrade
                 scope, seniority, or ownership. Rephrase in the JD's exact
                 vocabulary where the claim stays true — literal keyword
                 matching is what the ATS scores. Requirements with no
                 matching evidence stay gaps; they go in the report, never
                 into a bullet.
              3. jt verify <slug>   (must pass; if it flags something that is genuinely true,
                 fix profile/master.yaml — never loosen the check)
              4. jt build <slug> --no-pdf   (no TeX here; build.yml compiles)
              5. jt screen <slug>

            Then commit and push everything.

      - name: Report
        if: always() && steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          slugs="${{ steps.queue.outputs.slugs }}"
          [ -z "$slugs" ] && exit 0
          summary=$(jt status 2>/dev/null | head -25)
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "Tailored: $slugs"$'\n```\n'"$summary"$'\n```' '{content: $c}')" \
            >/dev/null || true
